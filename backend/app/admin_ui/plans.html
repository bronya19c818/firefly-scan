<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JuZiScan Admin - 套餐管理</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260713-2" />
  </head>
  <body>
    <!-- Dashboard View (Logged In) -->
    <div class="admin-layout hidden" id="dashboard-view">
      <!-- Left Sidebar -->
      <aside class="admin-sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <span class="brand-text">JuZiScan管理后台</span>
          </div>
          <button class="collapse-btn" type="button" aria-label="折叠侧边栏" aria-expanded="true" title="折叠侧边栏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="11 17 6 12 11 7"></polyline>
              <polyline points="18 17 13 12 18 7"></polyline>
            </svg>
          </button>
        </div>

        <!-- Sidebar Menus -->
        <nav class="sidebar-menus">
          <!-- Workspace group -->
          <div class="menu-group expanded">
            <div class="group-title">
              <span>工作台</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="group-items">
              <a class="menu-item" href="/admin">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="9"></rect>
                  <rect x="14" y="3" width="7" height="5"></rect>
                  <rect x="14" y="12" width="7" height="9"></rect>
                  <rect x="3" y="16" width="7" height="5"></rect>
                </svg>
                <span>系统概览</span>
              </a>
            </div>
          </div>

          <!-- User center group -->
          <div class="menu-group expanded">
            <div class="group-title">
              <span>用户中台</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="group-items">
              <a class="menu-item" href="/admin/users">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                  <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
                <span>用户列表</span>
              </a>
              <a class="menu-item" href="/admin/active">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                </svg>
                <span>活跃分析</span>
              </a>
            </div>
          </div>

          <!-- Finance group -->
          <div class="menu-group expanded">
            <div class="group-title">
              <span>财务管理</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="group-items">
              <a class="menu-item" href="/admin/orders">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                  <line x1="1" y1="10" x2="23" y2="10"></line>
                </svg>
                <span>订单列表</span>
              </a>
              <a class="menu-item active" href="/admin/plans">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="3" y1="9" x2="21" y2="9"></line>
                  <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                <span>套餐管理</span>
              </a>
            </div>
          </div>

          <!-- Operation group -->
          <div class="menu-group expanded">
            <div class="group-title">
              <span>运营管理</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="group-items">
              <a class="menu-item" href="/admin/feedbacks">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>意见反馈</span>
              </a>
              <a class="menu-item" href="/admin/sms">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="20" rx="2" ry="2"></rect>
                  <path d="M22 6L12 13 2 6"></path>
                </svg>
                <span>短信记录</span>
              </a>
              <a class="menu-item" href="/admin/versions">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <span>版本管理</span>
              </a>
            </div>
          </div>
        </nav>

        <!-- Sidebar Profile Footer -->
        <div class="sidebar-footer">
          <div class="admin-profile">
            <div class="avatar-circle small" id="admin-avatar">A</div>
            <div class="profile-info">
              <strong id="current-admin-name">Admin</strong>
              <span id="current-admin-email">admin@yuandian.cn</span>
            </div>
          </div>
          <button id="logout-button" class="logout-icon-btn" title="退出登录" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </aside>

      <!-- Right Main Workspace -->
      <div class="admin-workspace">
        <!-- Top Navbar -->
        <header class="workspace-header">
          <div class="breadcrumb">
            <span class="parent-node">运营管理</span>
            <span class="divider">/</span>
            <span class="active-node">套餐管理</span>
          </div>
        </header>

        <!-- View Panel: Plans -->
        <main class="workspace-body">
          <div class="tab-pane active" id="tab-plans">
            <div class="page-title-block">
              <h2>会员套餐管理</h2>
              <p>配置与管理 App 客户端展示的会员定价套餐，支持动态修改售价、状态、期限及标签文案。</p>
            </div>

            <!-- Table Panel -->
            <div class="panel" style="margin-top: 15px;">
              <div class="table-wrap">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th style="width: 100px;">套餐代码</th>
                      <th style="width: 100px;">套餐名称</th>
                      <th style="width: 80px;">售价</th>
                      <th style="width: 80px;">原价</th>
                      <th style="width: 100px;">会员期限</th>
                      <th style="width: 160px;">副标题/折算标签</th>
                      <th style="width: 100px;">角标文案</th>
                      <th style="width: 80px; text-align: center;">是否默认</th>
                      <th style="width: 80px; text-align: center;">状态</th>
                      <th style="width: 80px; text-align: center;">排序权重</th>
                      <th style="width: 80px; text-align: center;">操作</th>
                    </tr>
                  </thead>
                  <tbody id="plans-table-body">
                    <tr>
                      <td colspan="11" style="text-align: center; color: var(--text-secondary); padding: 24px 0;">正在加载中...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Edit dialog modal -->
    <dialog id="plan-dialog" style="border: none; border-radius: 12px; padding: 24px; max-width: 500px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.15); font-family: inherit;">
      <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 18px; color: var(--text-primary);">编辑会员套餐</h3>
      <form id="plan-form" style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">套餐代码 (不可修改)</label>
          <input id="form-plan-code" type="text" readonly disabled style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; background-color: #f5f5f5; color: #888;" />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">套餐名称 (title)</label>
          <input id="form-plan-title" type="text" required placeholder="例如：年度会员" style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px;" />
        </div>
        <div style="display: flex; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
            <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">售价 (price, 元)</label>
            <input id="form-plan-price" type="number" step="0.01" min="0" required placeholder="例如：99.00" style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;" />
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
            <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">原价/划线价 (元)</label>
            <input id="form-plan-original-price" type="number" step="0.01" min="0" placeholder="例如：288.00 (选填)" style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;" />
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">会员时长天数 (duration_days)</label>
          <input id="form-plan-duration" type="number" min="1" placeholder="留空表示终身/永久会员" style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px;" />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">副标题/底栏标签 (bottom_label)</label>
          <input id="form-plan-bottom-label" type="text" required placeholder="例如：0.27元/天" style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px;" />
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">角标推荐文本 (tag_text)</label>
          <input id="form-plan-tag-text" type="text" placeholder="例如：超值推荐 (选填)" style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px;" />
        </div>
        <div style="display: flex; gap: 12px;">
          <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
            <label style="font-size: 13.5px; color: var(--text-secondary); font-weight: 500;">排序权重 (sort_order)</label>
            <input id="form-plan-sort-order" type="number" required placeholder="值越小越靠前" style="padding: 8px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box;" />
          </div>
        </div>
        <div style="display: flex; gap: 20px; align-items: center; margin-top: 4px;">
          <div style="display: flex; align-items: center; gap: 6px;">
            <input id="form-plan-is-default" type="checkbox" style="width: 16px; height: 16px; cursor: pointer;" />
            <label for="form-plan-is-default" style="font-size: 14px; color: var(--text-primary); cursor: pointer; user-select: none;">设为默认推荐</label>
          </div>
          <div style="display: flex; align-items: center; gap: 6px;">
            <input id="form-plan-is-active" type="checkbox" style="width: 16px; height: 16px; cursor: pointer;" />
            <label for="form-plan-is-active" style="font-size: 14px; color: var(--text-primary); cursor: pointer; user-select: none;">上架启用套餐</label>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px;">
          <button id="cancel-plan-btn" type="button" style="padding: 8px 16px; border: 1px solid #d9d9d9; border-radius: 6px; background: white; cursor: pointer; font-size: 14px;">取消</button>
          <button type="submit" style="padding: 8px 16px; border: none; border-radius: 6px; background: #0b63ff; color: white; cursor: pointer; font-size: 14px; font-weight: 500;">保存</button>
        </div>
      </form>
    </dialog>

    <script src="/assets/app.js?v=20260713-2"></script>
  </body>
</html>
