<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JuZiScan Admin - 活跃分析</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260713" />
    <style>
      /* Visual bar chart style */
      .chart-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 24px;
        margin-bottom: 24px;
      }
      .chart-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }
      .chart-header h3 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--text);
      }
      .trend-bars-container {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        height: 180px;
        padding-top: 20px;
        border-bottom: 1px solid var(--border);
        position: relative;
      }
      .trend-bar-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
        margin: 0 4px;
        height: 100%;
        justify-content: flex-end;
        min-width: 20px;
      }
      .trend-bar-tooltip {
        position: relative;
        background: var(--bg-tooltip, #1e293b);
        color: #fff;
        font-size: 11px;
        padding: 4px 6px;
        border-radius: 4px;
        bottom: 8px;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        transform: translateY(4px);
        pointer-events: none;
        white-space: nowrap;
        z-index: 10;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      }
      .trend-bar-wrapper:hover .trend-bar-tooltip {
        opacity: 1;
        transform: translateY(0);
      }
      .trend-bar {
        width: 100%;
        background: linear-gradient(180deg, #6366f1 0%, #4f46e5 100%);
        border-radius: 4px 4px 0 0;
        min-height: 2px;
        transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
      }
      .trend-bar:hover {
        background: linear-gradient(180deg, #818cf8 0%, #6366f1 100%);
        filter: brightness(1.1);
      }
      .trend-date {
        font-size: 11px;
        color: var(--text-secondary);
        margin-top: 8px;
        transform: rotate(-35deg);
        transform-origin: top center;
        white-space: nowrap;
        height: 25px;
      }
      .stats-summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .stat-mini-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 16px;
        text-align: center;
      }
      .stat-mini-card h4 {
        margin: 0 0 8px 0;
        font-size: 13px;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .stat-mini-card p {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        color: var(--text);
      }
      .pagination-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        padding: 12px 16px;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
      }
      .pagination-info {
        font-size: 13px;
        color: var(--text-secondary);
      }
      .pagination-actions {
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>

              <polyline points="18 17 13 12 18 7"></polyline>

        <!-- Sidebar Menus -->

              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </div>
            <div class="group-items">
              <a class="menu-item" href="/admin/users">
                <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              <a class="menu-item active" href="/admin/active">

          </div>

          <!-- Finance group -->

          <!-- Operation group -->
          <div class="menu-group expanded">

            </div>

                <span>版本管理</span>

        <!-- Sidebar Profile Footer -->
        <div class="sidebar-footer">
          <div class="admin-profile">
            <div class="avatar-circle small" id="admin-avatar">A</div>
            <div class="profile-info">

      <!-- Right Main Workspace -->
      <div class="admin-workspace">
        <!-- Top Navbar -->
        <header class="workspace-header">
          <div class="breadcrumb">
            <span class="parent-node">用户中台</span>
            <span class="divider">/</span>
            <span class="active-node">活跃分析</span>
          </div>
        </header>

        <!-- View Panel: Active User Analytics -->
        <main class="workspace-body">
          <div class="tab-pane active" id="tab-active">
            <div class="page-title-block">
              <h2>活跃度分析</h2>
              <p>分析用户端日活（DAU）的趋势并查看用户的活跃明细日志。</p>
            </div>

            <!-- Mini Summary Cards -->
            <div class="stats-summary">
              <div class="stat-mini-card">
                <h4>今日活跃用户 (DAU)</h4>
                <p id="stats-dau-today">0</p>
              </div>
              <div class="stat-mini-card">
                <h4>昨日活跃用户 (DAU)</h4>
                <p id="stats-dau-yesterday">0</p>
              </div>
              <div class="stat-mini-card">
                <h4>本周平均日活</h4>
                <p id="stats-dau-weekly-avg">0</p>
              </div>
            </div>

            <!-- Chart Panel -->
            <div class="chart-card">
              <div class="chart-header">
                <h3>活跃趋势 (最近 15 天)</h3>
                <div>
                  <select id="trend-days-select" class="limit-select" style="width: 100px;">
                    <option value="15">最近 15 天</option>
                    <option value="30">最近 30 天</option>
                  </select>
                </div>
              </div>
              <div class="trend-bars-container" id="trend-bars">
                <!-- Bars dynamically generated by JS -->
              </div>
              <div style="height: 35px;"></div>
            </div>

            <!-- Filter Panel -->
            <fieldset class="filter-panel">
              <div class="filter-row">
                <label class="filter-item">
                  <span>模糊搜索</span>
                  <input id="active-filter-search" type="text" placeholder="搜索昵称、手机号或邮箱" />
                </label>
                <label class="filter-item">
                  <span>活跃日期</span>
                  <input id="active-filter-date" type="date" />
                </label>
              </div>
              <div class="filter-actions">
                <button id="search-active-button" class="btn-primary" type="button">筛选</button>
                <button id="reset-active-button" class="btn-default" type="button">重置</button>
              </div>
            </fieldset>

            <!-- Segmented Control & Action bar -->
            <div class="action-bar">
              <div style="font-weight: 500; font-size: 15px; color: var(--text);">活跃日志明细</div>
              <div class="action-tools">
                <select id="active-limit" class="limit-select">
                  <option value="50">显示 50 条</option>
                  <option value="100">显示 100 条</option>
                  <option value="200">显示 200 条</option>
                </select>
              </div>
            </div>

            <!-- Table Card -->
            <div class="table-card">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>记录 ID</th>
                      <th>用户 ID</th>
                      <th>用户昵称</th>
                      <th>手机号</th>
                      <th>邮箱</th>
                      <th>活跃日期</th>
                      <th>最后活动时间</th>
                    </tr>
                  </thead>
                  <tbody id="active-table-body">
                    <!-- Logs dynamically generated by JS -->
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Pagination -->

                显示 0-0 条，共 0 条记录
              </div>
              <div class="pagination-actions">
                <button class="btn-default" id="prev-active-btn" type="button">上一页</button>
                <button class="btn-default" id="next-active-btn" type="button">下一页</button>

            </div>
